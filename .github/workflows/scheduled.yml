name: Scheduled

# Checks whose results change without a commit here, or that take too long for every pull request,
# weekly and on demand. A weekly run with a failed job opens an issue (scheduled-issue.yml).
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  # New advisories for pnpm-lock.yaml, and zizmor's online audits (impostor commits,
  # known-vulnerable actions), which pull requests leave out.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm audit
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor@1.31.1
      - run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }}

  # The property tests with random seeds and many more cases than pull requests run. A failure
  # prints its seed and path; FC_SEED and FC_PATH replay it locally.
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: node --test test/props.test.ts
        env:
          FC_RANDOM: '1'
          FC_RUNS: '20000'

  # Every link in the Markdown (lychee.toml), which pull requests check offline: files and anchors
  # only.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress .
          output: ${{ runner.temp }}/lychee.md

  # Weekly runs only: a failed job opens an issue, or comments on the open one, and the next run
  # that passes closes it.
  report:
    needs: [audit, props, links]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-issue.yml
    with:
      details: >-
        A failed property prints its seed and path; `FC_SEED=<seed> FC_PATH=<path> node --test
        test/props.test.ts` replays it.
